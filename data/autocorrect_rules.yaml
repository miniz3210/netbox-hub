auto_corrections:
  port_shortening:
    - pattern: '(?i)\b(xgigabitethernet|xge)\s*(\d+[\d/:]*)\b'
      replacement: 'XGE\2'
      description: 'Shorten XGigabitEthernet/XGE ports to XGE (e.g. XGigabitEthernet0/0/31 -> XGE0/0/31)'
      enabled: true
    - pattern: '(?i)\b(tengigabitethernet|te)\s*(\d+[\d/:]*)\b'
      replacement: 'Te\2'
      description: 'Shorten TenGigabitEthernet/TE ports to Te (e.g. TenGigabitEthernet1/0/1 -> Te1/0/1)'
      enabled: true
    - pattern: '(?i)\b(gigabitethernet|ge)\s*(\d+[\d/:]*)\b'
      replacement: 'GE\2'
      description: 'Shorten GigabitEthernet/GE ports to GE (e.g. GigabitEthernet1/0/24 -> GE1/0/24)'
      enabled: true
    - pattern: '(?i)\b(fastethernet|fe)\s*(\d+[\d/:]*)\b'
      replacement: 'FE\2'
      description: 'Shorten FastEthernet/FE ports to FE (e.g. FastEthernet0/1 -> FE0/1)'
      enabled: true
    - pattern: '(?i)\b(ethernet|eth)\s*(\d+[\d/:]*)\b'
      replacement: 'Eth\2'
      description: 'Shorten Ethernet/ETH ports to Eth (e.g. Ethernet1/1 -> Eth1/1)'
      enabled: true
    - pattern: '(?i)\b(port-channel|po)\s*(\d+)\b'
      replacement: 'Po\2'
      description: 'Shorten Port-channel/PO ports to Po (e.g. Port-channel10 -> Po10)'
      enabled: true
    - pattern: '(?i)\b(fortygigabitethernet|fo)\s*(\d+[\d/:]*)\b'
      replacement: 'Fo\2'
      description: 'Shorten FortyGigabitEthernet/FO ports to Fo (e.g. FortyGigabitEthernet0/1 -> Fo0/1)'
      enabled: true
    - pattern: '(?i)\b(twentyfivegigabitethernet|twentyfivegige|twe)\s*(\d+[\d/:]*)\b'
      replacement: 'Twe\2'
      description: 'Shorten TwentyFiveGigabitEthernet/TWE ports to Twe'
      enabled: true
    - pattern: '(?i)\b(hundredgigabitethernet|hundredgige|hu)\s*(\d+[\d/:]*)\b'
      replacement: 'Hu\2'
      description: 'Shorten HundredGigabitEthernet/HU ports to Hu'
      enabled: true
    - pattern: '(?i)\b(twohundredgige|twohundredgigabitethernet)\s*(\d+[\d/:]*)\b'
      replacement: 'TwoHu\2'
      description: 'Shorten 200GigabitEthernet ports to TwoHu'
      enabled: true
    - pattern: '(?i)\b(fourhundredgige|fourhundredgigabitethernet)\s*(\d+[\d/:]*)\b'
      replacement: 'FourHu\2'
      description: 'Shorten 400GigabitEthernet ports to FourHu'
      enabled: true
    - pattern: '(?i)\b(management|mgmt)\s*(\d+[\d/:]*)\b'
      replacement: 'Mgmt\2'
      description: 'Shorten Management/MGMT ports to Mgmt (e.g. Management1 -> Mgmt1)'
      enabled: true
    - pattern: '(?i)\b(loopback|lo)\s*(\d+)\b'
      replacement: 'Lo\2'
      description: 'Shorten Loopback/LO ports to Lo (e.g. Loopback0 -> Lo0)'
      enabled: true
    - pattern: '(?i)\b(vlan)\s*(\d+)\b'
      replacement: 'Vlan\2'
      description: 'Normalize VLAN interface naming (e.g. Vlan10 -> Vlan10)'
      enabled: true
    - pattern: '(?i)\b(tunnel|tu)\s*(\d+)\b'
      replacement: 'Tu\2'
      description: 'Shorten Tunnel/TU ports to Tu (e.g. Tunnel0 -> Tu0)'
      enabled: true
  vmware:
    - pattern: '(?i)\b(vswitch)(\d+)\b'
      replacement: 'vSwitch\2'
      description: 'Normalize vSwitch casing (vswitchX -> vSwitchX)'
      enabled: true
    - pattern: '(?i)\b(dvswitch)(\d+)\b'
      replacement: 'dvSwitch\2'
      description: 'Normalize dvSwitch casing (dvswitchX -> dvSwitchX)'
      enabled: true
    - pattern: '(?i)\b(?:VMNIC|VmnIc)\s*(\d+)\b'
      replacement: 'vmnic\1'
      description: 'Normalize VMNIC casing to lowercase vmnic'
      enabled: true
    - pattern: '(?i)\bnic\s*(\d+)\b'
      replacement: 'vmnic\1'
      description: 'Standardize nicX to vmnicX'
      enabled: true
    - pattern: '(?i)\beth\s*(\d+)\b'
      replacement: 'vmnic\1'
      description: 'Standardize ethX to vmnicX'
      enabled: true
    - pattern: '(?i)\b(vmk)(\d+)\b'
      replacement: 'vmk\2'
      description: 'Normalize VMkernel adapter casing (VMKX -> vmkX)'
      enabled: true