  "topology_parsing_presets": {
    "VMware ESXi": {
      "platform": "VMware ESXi",
      "aliases": {
        "parent": [
          "v_switch",
          "vswitch",
          "dvswitch"
        ],
        "interface": [
          "vmnic",
          "vmk",
          "port_group"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "allowed_types": [
        "Uplink",
        "VMkernel",
        "Port Group"
      ],
      "role_options": [
        "Active Uplink",
        "Standby Uplink",
        "None"
      ],
      "default_connected_role": "Active Uplink",
      "default_disconnected_role": "None",
      "sentinel_no_adapter": "No Uplink",
      "instructions": "You are an expert VMware hypervisor network architect and topology data modeling specialist.\nParse the provided sanitized OCR text from VMware ESXi Standard Switches (vSS), Distributed Switches (vDS), and HCI virtual switches.\n\nExtract ALL observed network entities into a flat JSON array of objects. Every record MUST strictly contain these lowercase keys:\n[\n  {\n    \"switch\": \"<Root Virtual Switch Name (e.g. vSwitch0, vSwitch01, vSwitch02, vSwitch1, vSwitchNutanix, dvSwitch0, iDMZ-vdSwitch02, PR Spain Fuenmayor Age VLab, PR Spain Fuenmayor VLab)>\",\n    \"interface\": \"<Interface name: physical adapter (e.g. vmnic0, vmnic1) or VMkernel (e.g. vmk0, vmk1). Empty string for pure VM Port Groups>\",\n    \"type\": \"<MANDATORY: Strictly one of 'Uplink', 'VMkernel', 'Port Group'>\",\n    \"ip\": \"<Preserve exact IP token placeholder present in the text (e.g. <SAFE_IP_1> or bare IP), otherwise empty string>\",\n    \"purpose\": \"<Exact Port Group or Service Name (e.g. Management Network, VM Network, iSCSI01, iSCSI02, vMotion Network, vSAN Network, ntnx-internal-vmk, ntnx-internal-pg, OnbaseBubbleNet). MUST BE EMPTY STRING for physical Uplinks!>\",\n    \"role\": \"<For Uplinks: 'Active Uplink' (default for connected vmnic), 'Standby Uplink', or 'None' (only for No Uplink). For VMkernel: 'Management' if vmk0/management else 'None'. For Port Group: 'VM Traffic' or 'None'>\",\n    \"speed\": \"<Link speed if visible (e.g. 10000 Full, 1000 Full), otherwise empty string>\"\n  }\n]\n\nCRITICAL TOPOLOGY INVARIANTS:\n\n1. HARD SWITCH BOUNDARIES & ISOLATION:\n   - Every occurrence of 'Standard Switch: <Name>' or 'Distributed Switch: <Name>' defines a NEW independent switch container. Terminate the previous switch immediately.\n   - Strip OCR chevron prefixes (e.g. '>', 'v', 'V', '^', '|', 'VStandard Switch:') to extract the clean switch name.\n   - In Distributed Switches (vDS), child uplink groups formatted like '<Switch>-DVUplinks-<ID>' (e.g. 'dvSwitch0-DVUplinks-47', 'iDMZ-vdSwitch02-DVUplinks-95') must be normalized to their root Distributed Switch name ('dvSwitch0', 'iDMZ-vdSwitch02'). Never emit an uplink group as a separate switch container.\n   - 'PR Spain Fuenmayor Age VLab', 'PR Spain Fuenmayor VLab', and 'vSwitch0' are THREE COMPLETELY SEPARATE switches:\n     * 'PR Spain Fuenmayor Age VLab' has NO physical adapters (interface: 'No Uplink', role: 'None').\n     * 'PR Spain Fuenmayor VLab' has NO physical adapters (interface: 'No Uplink', role: 'None').\n     * 'vSwitch0' is an independent switch containing vmnic4, vmnic5, vmk0 (Management Network), VM Network, and iSCSI Veeam. NEVER merge vSwitch0 into PR Spain Fuenmayor VLab!\n   - 'vSwitchNutanix' is an internal HCI switch (contains 'ntnx-internal-vmk' with vmk1 and 'ntnx-internal-pg'). Do not merge it with vSwitch0 or vSwitch1.\n\n2. PHYSICAL UPLINKS & vDS LEAF-NODE RULE (TYPE: 'Uplink'):\n   - Physical adapters ALWAYS follow the format 'vmnic<Number>' (e.g. 'vmnic0', 'vmnic1', 'vmnic2'). These are the ONLY physical interfaces.\n   - Connected physical adapters must have role: 'Active Uplink'. Do NOT output 'None' for active vmnic cards!\n   - In Distributed Switches (vDS), 'uplink1', 'uplink2', 'uplink3', 'uplink4' are intermediate port group SLOTS, NOT physical interfaces! Extract the child 'vmnicX' as the interface. NEVER output 'uplinkX' as the interface.\n   - If a vmnic has a red 'x', warning icon, or disconnected symbol (e.g. 'x vmnic1 ageotinfhost2...'), STILL extract it as interface: 'vmnic1', type: 'Uplink', role: 'Standby Uplink' or 'Active Uplink'. Do not omit it!\n   - Slots marked '(0 NIC Adapters)' (e.g. 'uplink3 (0 NIC Adapters)', 'uplink4 (0 NIC Adapters)') are empty and MUST BE COMPLETELY IGNORED.\n   - Physical uplinks NEVER belong to a Port Group. Set purpose: '' (empty string). NEVER assign Port Group names like 'Management Network' or 'iSCSI' to a vmnic adapter.\n   - If a switch explicitly has 'No physical network adapters' (e.g. 'PR Spain Fuenmayor Age VLab', 'vSwitchNutanix', 'vSwitch1' bubble net), emit a record with:\n     {\"switch\": \"<CurrentSwitch>\", \"interface\": \"No Uplink\", \"type\": \"Uplink\", \"ip\": \"\", \"purpose\": \"\", \"role\": \"None\", \"speed\": \"\"}\n\n3. VMKERNEL INTERFACES (TYPE: 'VMkernel'):\n   - All vmk interfaces ('vmk0', 'vmk1', etc.) MUST have type: 'VMkernel'. If OCR truncates to 'mk2', extract as 'vmk2'.\n   - The service card title directly preceding 'VMkernel Ports (X)' or 'VLAN ID:' is its PURPOSE (e.g. 'Management Network', 'iSCSI01', 'vMotion Network', 'vSAN Network', 'ntnx-internal-vmk').\n   - Merge the VMkernel interface and its purpose into a SINGLE record:\n     {\"switch\": \"<CurrentSwitch>\", \"interface\": \"vmkX\", \"purpose\": \"<CardTitle>\", \"type\": \"VMkernel\", \"ip\": \"<Token>\", \"role\": \"Management\" (if vmk0) else \"None\", \"speed\": \"\"}\n\n4. COMPLETE PORT GROUP EXTRACTION (NO EDGE TRUNCATION):\n   - Extract EVERY port group displaying 'Virtual Machines (X)'. Do not skip top-most or bottom-most items in long lists (e.g. 'Backplane Network', 'VM Net DMZ', 'VM Net Externa', 'VM Network', 'iSCSI Veeam', 'OnbaseBubbleNet', 'ntnx-internal-pg', 'iDMZ Servers', 'IDMZ-VLAN610').\n   - Standard record format:\n     {\"switch\": \"<CurrentSwitch>\", \"interface\": \"\", \"purpose\": \"<PortGroupName>\", \"type\": \"Port Group\", \"ip\": \"\", \"role\": \"VM Traffic\", \"speed\": \"\"}\n   - If 'Management Network' has VMkernel Ports (1) folded without an IP, extract it with purpose: 'Management Network' (never drop Management Network!).\n   - Do not duplicate a pure Port Group if that name is already assigned to a VMkernel on that switch.\n\n5. STRICT OUTPUT:\n   - Return ONLY a valid JSON array of objects. Do not include markdown code fences or explanatory text.",
      "export_prompt": "You are an expert VMware hypervisor network architect and topology data modeling specialist.\nParse the provided sanitized OCR text from VMware ESXi Standard Switches (vSS), Distributed Switches (vDS), and HCI virtual switches.\n\nExtract ALL observed network entities into a flat JSON array of objects. Every record MUST strictly contain these lowercase keys:\n[\n  {\n    \"switch\": \"<Root Virtual Switch Name (e.g. vSwitch0, vSwitch01, vSwitch02, vSwitch1, vSwitchNutanix, dvSwitch0, iDMZ-vdSwitch02, PR Spain Fuenmayor Age VLab, PR Spain Fuenmayor VLab)>\",\n    \"interface\": \"<Interface name: physical adapter (e.g. vmnic0, vmnic1) or VMkernel (e.g. vmk0, vmk1). Empty string for pure VM Port Groups>\",\n    \"type\": \"<MANDATORY: Strictly one of 'Uplink', 'VMkernel', 'Port Group'>\",\n    \"ip\": \"<Preserve exact IP token placeholder present in the text (e.g. <SAFE_IP_1> or bare IP), otherwise empty string>\",\n    \"purpose\": \"<Exact Port Group or Service Name (e.g. Management Network, VM Network, iSCSI01, iSCSI02, vMotion Network, vSAN Network, ntnx-internal-vmk, ntnx-internal-pg, OnbaseBubbleNet). MUST BE EMPTY STRING for physical Uplinks!>\",\n    \"role\": \"<For Uplinks: 'Active Uplink' (default for connected vmnic), 'Standby Uplink', or 'None' (only for No Uplink). For VMkernel: 'Management' if vmk0/management else 'None'. For Port Group: 'VM Traffic' or 'None'>\",\n    \"speed\": \"<Link speed if visible (e.g. 10000 Full, 1000 Full), otherwise empty string>\"\n  }\n]"
    },
