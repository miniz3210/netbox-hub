  "topology_parsing_presets": {
    "VMware ESXi": {
      "platform": "VMware ESXi",
      "aliases": {
        "parent": [
          "v_switch",
          "vswitch",
          "dvswitch"
        ],
        "interface": [
          "vmnic",
          "vmk",
          "port_group"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "instructions": "[TASK: VMWARE TOPOLOGY EXTRACTION - UNIVERSAL MULTI-HOST RECONCILIATION]\nExtract observable network entities from the VMware UI screenshot into structured JSON. Apply strict multi-architecture compatibility across both Standard Switches (VSS) and Distributed Switches (VDS).\n\n=== 1. SPATIAL CONTAINER & SWITCH ANCESTRY ===\n1. Switch Identification:\n   - Identify every expanded virtual switch container ('v' or '⌄') from top to bottom.\n   - Ignore left-hand navigation menus (e.g., 'Networking', 'Virtual switches' sidebar). Focus strictly on topology cards.\n   - PRESERVE SWITCH IDENTIFIERS VERBATIM: Keep all exact numbers and digits including two-digit numbering (e.g. 'vSwitch0', 'vSwitch01', 'vSwitch02', 'vSwitch1', 'dvSwitch0', 'iDMZ-vdSwitch02'). NEVER merge, strip leading zeros, or alter switch numbers!\n   - Ignore collapsed switch headers (prefixed with '>').\n2. Parent Mapping:\n   - Left Column (Port Groups & vmk): Parent is ALWAYS the root switch name. NEVER map logical entities to a '-DVUplinks-' container.\n   - Right Column (Physical vmnic):\n     * In Distributed Switches (DVS): Parent is strictly the specific Uplink group (e.g. 'dvSwitch0-DVUplinks-47', 'iDMZ-vdSwitch02-DVUplinks-95').\n     * In Standard Switches (VSS): Parent is the switch name itself (e.g. 'vSwitch0', 'vSwitch01').\n\n=== 2. PHYSICAL ADAPTER ('vmnic') DUAL-MODE EXTRACTION ===\n- MODE A: Standard Switches (VSS - Direct List):\n  * Physical adapters are listed directly under 'Physical network adapters'. Extract each visible 'vmnic<N>'.\n  * If it displays 'No physical network adapters', output ZERO vmnic rows.\n- MODE B: Distributed Switches (VDS - Nested Uplinks):\n  * Physical adapters are nested inside uplink slots (e.g. under 'uplink1', 'Uplink 1 [1 NIC Adapters]'). Discard slot header labels; extract only valid nested 'vmnic<N>'.\n  * EMPTY SLOTS: Slots stating '(0 NIC Adapters)' or displaying no adapters contain NO links. DO NOT invent, hallucinate, or sequentially increment extra adapters (e.g. do not invent vmnic4 if only 0 to 3 exist).\n- ADAPTER & SPEED NORMALIZATION:\n  * Split fused adapter and speed text cleanly (e.g. 'vmnic110000Full' -> interface: 'vmnic1', speed: '10 Gbit/s Full').\n  * Strip leading UI status icons (❌, X, !, ✔). A clean 'vmnic<N>' is valid: set \"is_uncertain\": false.\n\n=== 3. PORT GROUPS & VMKERNEL RULES ===\n- Extract every Port Group card:\n  * Preserve separate words and standard spelling (e.g. 'Management Network', 'vMotion Network', 'vSAN Network'). Do NOT merge words or misread 'vS' as 'G'.\n  * 'vlan': Read explicit 'VLAN ID: <N>' text inside each card (e.g. 400). If omitted or untagged, set to null without triggering an error.\n- Extract expanded VMkernel ports (vmk ID, IP) under 'VMkernel Ports'.\n\n=== 4. ACCURATE ANOMALY FLAGGING (is_uncertain) ===\nSet \"is_uncertain\": true and provide a \"note\" ONLY IF:\n1. Lexical Typos in Names:\n   - Obvious OCR misreads (e.g. 'GANNetwork' instead of 'vSAN Network', 'Van_' instead of 'Vlan_').\n   - Discrepancy between embedded name numbers and card's explicit VLAN ID (e.g. name has '69', VLAN ID has '609').\n2. Ambiguous Unreadable Text:\n   - Text is blurred, cut off by container boundaries, or partially occluded.\nFor valid entities, standard icon-stripped vmnics, and standard untagged VLANs: set \"is_uncertain\": false, \"note\": null.\n\n=== 5. OUTPUT FORMAT ===\nReturn ONLY a flat JSON array conforming to:\n[\n  {\n    \"type\": \"portgroup\" | \"vmnic\",\n    \"interface\": \"<Port Group label, vmk*, or clean vmnic*>\",\n    \"parent\": \"<Root SwitchName for logical; DVUplinks/Switch for vmnic>\",\n    \"vlan\": <Integer or null>,\n    \"vmk\": \"<vmk ID or null>\",\n    \"ip\": \"<IPv4 or null>\",\n    \"speed\": \"<Link speed or null>\",\n    \"is_uncertain\": <true | false>,\n    \"note\": \"<Short reason if uncertain, else null>\"\n  }\n]",
      "export_prompt": "You are an expert infrastructure network engineer specializing in VMware ESXi.\nI have attached screenshots of VMware ESXi virtual switch topology and physical network adapter properties.\nPlease analyze the images and extract the network topology into a flat JSON array of objects matching these exact attributes:\n- interface: 'vmnicX' or 'vmkX' (e.g., 'vmnic1', 'vmk0')\n- parent: 'vSwitchX' (e.g., 'vSwitch0'). TOPOLOGY PRIORITY: Every adapter listed in the switch's Physical Adapters column strictly belongs to that switch. NEVER output parent as null or unassigned for grouped/secondary adapters (e.g., vmnic5 under vSwitch0).\n- purpose: Pure service name ('Management Network', 'vMotion', 'iSCSI01') without appending switch names or roles. Secondary adapters inherit the primary management network purpose.\n- uplink_role: 'Active Uplink' by default for all connected vmnic adapters (unless explicitly marked standby in failover settings); leave empty string \"\" for vmk.\n- slot: Hardware PCIe slot (e.g., '0000:5b:00.0')\n- speed: Link speed (e.g., '10 Gbit/s Full', '1 Gbit/s Full')\n- ip: IPv4 address for vmk ports\n\nOutput ONLY a valid JSON array of objects: [ {...}, {...} ]. Do not wrap in markdown fences or include explanatory text.",
      "spatial_anchors_and_redaction": {
        "enabled": true,
        "anchors": [
          {
            "role": "left_boundary",
            "patterns": [
              "Virtual switches",
              "Networking"
            ]
          },
          {
            "role": "container_header",
            "patterns": [
              "Standard Switch:",
              "DVSwitch:",
              "vSphere Distributed Switch:"
            ]
          },
          {
            "role": "adapter_column",
            "patterns": [
              "Physical Adapters",
              "Uplinks"
            ]
          }
        ],
        "redact_ipv4": true,
        "redact_domains": true,
        "domain_patterns": [
          "\\.adds$",
          "\\.local$",
          "\\.internal$",
          "\\.corp$"
        ],
        "redact_mac": true
      },
      "service_delimiters": [
        "VLAN ID:",
        "VMkernel Ports",
        "Virtual Machines"
      ],
      "teaming_rules": {
        "no_uplink_display": "No Uplink",
        "empty_role_token": "None",
        "uplink_to_teaming_mapping": {
          "Active Uplink": "Active",
          "Standby Uplink": "Standby",
          "Primary": "Primary",
          "Backup": "Backup",
          "None": ""
        }
      },
        "ui_noise_blacklist": [
