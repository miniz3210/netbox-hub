==============================================================================\n4. ISOLATED & NO-UPLINK SWITCHES\n================================================================================\n- If a switch explicitly displays 'No physical network adapters' or lacks physical adapters across all screenshots, output a placeholder uplink record:\n  interface: \"No Uplink\", type: \"Uplink\", role: \"None\", purpose: \"Internal Only\", ip: \"\", speed: \"\".\n\n================================================================================\n5. ATOMIC RECORD SCHEMA & VALUE CONSTRAINTS\n================================================================================\nEvery record in the output JSON array must strictly contain these 7 keys:\n1. \"switch\": Clean virtual switch identifier.\n2. \"interface\": 'vmnic<N>', 'vmk<N>', 'No Uplink', or \"\" for pure Port Groups.\n3. \"type\": \"Uplink\", \"VMkernel\", or \"Port Group\".\n4. \"ip\": Valid IPv4 address for VMkernel ports; empty string \"\" for all others.\n5. \"purpose\": \n   - For VMkernel ports: specific service name (e.g., 'Management Network', 'vMotion Network', 'vSAN Network', 'iSCSI01').\n   - For physical adapters: inherit switch primary service or 'Uplink'.\n   - For pure Port Groups: the exact port group label (e.g., 'PR Spain Fuenmayor VLab VM', 'VM Network', 'iDMZ Servers').\n   - STRICT PROHIBITION: Do NOT append '(vSwitchX)', 'Active Uplink', or role strings into 'purpose'.\n6. \"role\": \"Active Uplink\" (default for connected vmnic), \"Standby Uplink\", or \"None\".\n7. \"speed\": Normalized speed string (e.g., '10 Gbit/s Full', '1 Gbit/s Full') if visible; otherwise \"\".\n\n================================================================================\nOUTPUT FORMAT:\nReturn ONLY a valid, raw JSON array of objects.\nDo not wrap in markdown code blocks.\nDo not include introductory or explanatory text."
