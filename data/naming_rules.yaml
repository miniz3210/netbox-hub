  "ipam_role_mappings": [
    {
      "pattern": "(?i)^guests?$",
      "replacement": "Guests",
      "description": "Normalize guest / guests to Guests",
      "enabled": true
    },
    {
      "pattern": "(?i)^corp[_\\s\\-]?wifi$",
      "replacement": "Corporate WiFi",
      "description": "Normalize corporate wifi variations",
      "enabled": true
    },
    {
