      "default_connected_role": "Active",
      "default_disconnected_role": "None",
      "sentinel_no_adapter": "No Slaves",
      "instructions": "Parse Proxmox VE network configurations into standard JSON entities.\n\nExtract ALL observed network entities into a flat JSON array of objects. Every record MUST strictly contain these lowercase keys:\n[\n  {\n    \"switch\": \"<Bridge name (e.g. vmbr0, vmbr1)>\",\n    \"interface\": \"<Interface name: bond (e.g. bond0), physical (e.g. ens18, eno1), or empty for bridges>\",\n    \"type\": \"<MANDATORY: Strictly one of 'Bridge Port', 'Linux Bond', 'Linux Bridge', 'VLAN'>\",\n    \"ip\": \"<CIDR IP if assigned, otherwise empty string>\",\n    \"purpose\": \"<Functional description or VLAN profile>\",\n    \"role\": \"<For Bonds: 'Active' (default for slave), 'Backup', or 'None' (only for No Slaves). For Bridges: 'None'. For VLANs: 'None'>\",\n    \"speed\": \"<Link speed if visible, otherwise empty string>\"\n  }\n]\n\nCRITICAL RULES:\n1. Bridges (vmbr0, vmbr1) get type: 'Linux Bridge' with empty interface.\n2. Bonds (bond0) get type: 'Linux Bond' with parent bridge.\n3. Physical NICs (ens18, eno1) get type: 'Bridge Port' as slaves of a bond or bridge.\n4. If a bond has no slaves, emit: interface: 'No Slaves', type: 'Linux Bond', role: 'None'.\n5. VLANs tagged on bridges get type: 'VLAN'.\n6. Return ONLY a valid JSON array of objects.",
      "export_prompt": "Parse Proxmox VE network configurations into standard JSON entities.\n\nExtract ALL observed network entities into a flat JSON array of objects. Every record MUST strictly contain these lowercase keys:\n[\n  {\n    \"switch\": \"<Bridge name (e.g. vmbr0, vmbr1)>\",\n    \"interface\": \"<Interface name: bond (e.g. bond0), physical (e.g. ens18, eno1), or empty for bridges>\",\n    \"type\": \"<MANDATORY: Strictly one of 'Bridge Port', 'Linux Bond', 'Linux Bridge', 'VLAN'>\",\n    \"ip\": \"<CIDR IP if assigned, otherwise empty string>\",\n    \"purpose\": \"<Functional description or VLAN profile>\",\n    \"role\": \"<For Bonds: 'Active' (default for slave), 'Backup', or 'None' (only for No Slaves). For Bridges: 'None'. For VLANs: 'None'>\",\n    \"speed\": \"<Link speed if visible, otherwise empty string>\"\n  }\n]\n\nReturn ONLY a valid JSON array of objects."
    },
