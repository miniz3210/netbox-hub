  "site_code_rules": {
    "separators": [
      " ",
      "-",
      "_"
    ],
    "multi_word_chars_per_word": [
      2,
      2
    ],
    "single_word_max_chars": 4,
    "fallback": "SITE",
    "exact_mappings": {
      "new york": "NYC",
      "london": "LON",
      "sydney": "SYD",
      "singapore": "SIN",
      "tokyo": "TYO",
      "hong kong": "HKGSAR",
      "amsterdam": "AMS",
      "frankfurt": "FRA",
      "paris": "PAR",
      "chicago": "CHI",
      "los angeles": "LAX",
      "san francisco": "SFO",
      "dallas": "DFW",
      "seattle": "SEA",
      "boston": "BOS",
      "toronto": "YYZ",
      "bristol": "BRS",
      "age": "AGE",
      "iceland": "ICLL"
    }
  },
  "vlan_description_mappings": {
    "Corporate WiFi": "VIN_Corp",
    "Workstations": "Wired Workstations",
    "Management": "Management",
    "Printers": "Printers",
    "Guests": "VIN_Guest",
    "Audio Visual": "AV equipment",
    "Mobiles": "VIN_Mobi"
