        ]
    },
    "Proxmox VE": {
      "platform": "Proxmox VE",
      "aliases": {
        "parent": [
          "bridge",
          "vmbr"
        ],
        "interface": [
          "bond",
          "eth",
          "eno",
          "ens",
          "vmbr"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "instructions": "[PLATFORM ARCHITECTURE: PROXMOX VE]\n1. HIERARCHY & BRIDGES:\n   - Root bridges: 'vmbr0', 'vmbr1', etc.\n   - Bonds: 'bond0', 'bond1', etc.\n   - Physical slaves: 'eno1', 'ens18', etc.\n2. ATOMIC ATTRIBUTES:\n   - \"interface\": Interface or bridge name.\n   - \"parent\": Connected bridge or bond master.\n   - \"purpose\": Functional service name or VLAN purpose.\n   - \"ip\": CIDR IP address assigned to bridge/interface.\n   - \"speed\": Link speed if visible.",
      "export_prompt": "You are an expert infrastructure network engineer specializing in Proxmox VE.\nI have attached screenshots of Proxmox VE network configuration (/etc/network/interfaces / GUI).\nPlease extract the Linux Bridge (vmbr), Bond, and physical interfaces into the standard atomic JSON format matching these exact attributes:\n- interface: 'vmbrX', 'bondX', or physical NIC ('ensX', 'enoX')\n- parent: Connected bridge or master\n- purpose: Functional description or VLAN profile\n- ip: CIDR IP address if assigned\n\nOutput ONLY a JSON object with key \"interfaces\": array of objects."
    },
    "Microsoft Azure": {
      "platform": "Microsoft Azure",
      "instructions": "1. Acquire a high‑resolution screenshot or PDF of the Azure network topology diagram.\n2. Pre‑process the image: convert to grayscale, apply contrast enhancement, and de‑skew if needed.\n3. Run OCR (e.g., Tesseract) on the entire image to extract all textual elements.\n4. Parse OCR output line‑by‑line, normalising whitespace and removing OCR artefacts (e.g., \"l\" vs \"1\").\n5. Identify graphical primitives using a computer‑vision library (OpenCV):\n   a. Detect rectangles, rounded rectangles, and clouds – typically representing Azure resources (VMs, VNet, Subnet, Load Balancer, etc.).\n   b. Detect arrows/lines – representing connections or traffic flow.\n   c. Detect icons/logos – map known Azure icons (e.g., \"Virtual Machine\", \"SQL Database\", \"Application Gateway\") to resource types.\n6. Correlate OCR‑extracted text with detected shapes by spatial proximity (centroid of text within shape bounds).\n7. Build a structured representation:\n   a. For each resource, capture: name, type (derived from icon or keyword), region, resource group (if present), and any tags.\n   b. For each connection, capture source resource, destination resource, direction (if arrow is unidirectional), and protocol/port annotations (if present).\n8. Resolve hierarchical relationships:\n   a. Group resources under their VNet/Subnet containers based on nesting or explicit labels.\n   b. Associate NICs, Public IPs, and Load Balancers with the VM they belong to.\n9. Validate extracted data against Azure naming conventions and known resource schemas (e.g., VM names must match /^[a-z0-9-]{1,64}$/).\n10. Output the final topology as a JSON object with two top‑level arrays: \"resources\" and \"connections\".\n11. Perform a sanity check: ensure every connection references existing resources and that there are no orphan nodes.\n12. Log any ambiguous or low‑confidence detections for manual review.",
      "export_prompt": "You are an AI assistant tasked with extracting a complete Azure network topology from a screenshot or PDF diagram. The diagram may contain Azure resource icons (VM, VNet, Subnet, Application Gateway, Azure Firewall, Load Balancer, Storage Account, etc.), textual labels, and arrows indicating connections.\n\nYour job is to:\n1. Identify every Azure resource, capturing its exact name as shown, its type (based on icon or label), and any additional attributes such as region, resource group, or tags.\n2. Detect all connections between resources, noting the source, destination, direction (if the arrow is one‑way), and any protocol/port information displayed on the line.\n3. Preserve hierarchical relationships (e.g., VMs inside a Subnet, Subnets inside a VNet).\n4. Return the extracted data in the following JSON structure:\n{\n  \"resources\": [\n    {\n      \"name\": \"<resource_name>\",\n      \"type\": \"<azure_resource_type>\",\n      \"region\": \"<region_if_present>\",\n      \"resource_group\": \"<resource_group_if_present>\",\n      \"tags\": { \"key\": \"value\", ... }\n    }\n    ...\n  ],\n  \"connections\": [\n    {\n      \"source\": \"<source_resource_name>\",\n      \"destination\": \"<dest_resource_name>\",\n      \"direction\": \"unidirectional|bidirectional\",\n      \"protocol\": \"<protocol_if_shown>\",\n      \"port\": \"<port_if_shown>\"\n    }\n    ...\n  ]\n}\n\nIf any element is ambiguous or unreadable, mark its value as null and add a comment field explaining the uncertainty. Do not include any explanatory text outside the JSON. Ensure the JSON is syntactically valid.",
      "aliases": {
        "parent": [
          "vnet",
          "virtual_network"
        ],
        "interface": [
          "eth0",
          "vNIC",
          "nic"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      }
    }
