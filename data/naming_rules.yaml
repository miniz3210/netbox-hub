  "topology_parsing_presets": {
    "VMware ESXi": {
      "platform": "VMware ESXi",
      "aliases": {
        "parent": [
          "v_switch",
          "vswitch",
          "dvswitch"
        ],
        "interface": [
          "vmnic",
          "vmk",
          "port_group"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "instructions": "[PLATFORM ARCHITECTURE: VMWARE ESXI - PRODUCTION RECONCILIATION]\n\n1. OCR NOISE FILTERING & BOUNDARY HYGIENE:\n   - Discard all sidebar navigation menu items: 'Summary', 'Monitor', 'Configure', 'Permissions', 'VMs', 'Datastores', 'Networks', 'Updates', 'Storage', 'Networking', 'Virtual switches', 'System', 'Hardware'.\n   - Discard action controls: 'ADD NETWORKING', 'EDIT', 'MANAGE PHYSICAL ADAPTERS', 'REFRESH', 'ACTIONS'.\n   - NEVER drop a genuine Port Group card merely because it shares a line or sits adjacent to menu items.\n\n2. SWITCH INSTANCE & TOPOLOGY SCOPING:\n   - Switch containers are identified by the header pattern (e.g., 'Standard Switch: <name>', 'DVSwitch: <name>').\n   - Collapsed switches marked by '>' (e.g. '> Standard Switch: ...') indicate boundaries. All cards preceding a collapsed switch belong strictly to the expanded switch above them.\n   - Dedicated switches showing 'No physical network adapters' or 'No associated port groups' are valid active switches.\n\n3. EXHAUSTIVE DUAL-LAYER ENTITY EXTRACTION:\n   You MUST extract BOTH physical/kernel adapters AND all Port Group logical networks:\n   A. Physical Adapters: 'vmnic*' (Speed, Uplink role).\n   B. VMkernel Adapters: 'vmk*' (IP, purpose: 'vmkernel' or enclosing Port Group).\n   C. Port Groups: Extract EVERY single named Port Group card as an individual entity:\n      * Scan every visual box: e.g. 'Management Network', 'VM Network', 'iSCSI', 'iSCSI Veeam', 'iSCSI01', 'iSCSI02', 'vMotion'.\n      * ZERO-COUNT RULE: NEVER omit a Port Group because its VM count is '(0)'.\n      * ENCLOSING VMKERNEL RULE: If a Port Group card encloses a VMkernel adapter (e.g. 'VMkernel Ports (1)'), you MUST extract the Port Group as an independent entity, AND extract the enclosed 'vmk*' as a separate entity. NEVER omit the outer Port Group name.\n      * Set 'interface' to the normalized Port Group label.\n      * Set 'parent' to the enclosing switch instance.\n      * Set 'purpose' to the Port Group name itself.\n      * Leave 'uplink_role', 'speed', and 'ip' empty (\"\").\n\n4. STRICT 1-TO-1 LOCAL IP BINDING:\n   - Each VMkernel adapter (vmk*) MUST bind ONLY to the specific IP address appearing directly next to it in its visual block.\n   - NEVER propagate an IP address from one vmk adapter to another.\n   - Port Groups do NOT have an IP attribute. NEVER copy a vmk IP into a Port Group row.\n\n5. IDENTIFIER DIGIT & PROTOCOL NORMALIZATION:\n   - Digits & System Tokens: Normalize OCR letter/digit confusions in switch identifiers (e.g., 'vSwitcho' -> 'vSwitch0', 'vSwitcho1' -> 'vSwitch01'). Retain 'vmnic*', 'vmk*', 'vSwitch*' prefixes intact.\n   - Word Spacing Hygiene: Restore proper word boundaries for common names that lost spaces during OCR (e.g., 'ManagementNetwork' -> 'Management Network', 'VMNetwork' -> 'VM Network', 'TestVLAN*' -> 'Test VLAN *').\n   - Protocol Casing: Standardize networking protocols to their official casing (e.g., normalize 'iscSI', 'iScSI' -> 'iSCSI'; normalize 'vmotion' -> 'vMotion').\n\n6. MANDATORY ATOMIC JSON ATTRIBUTES:\n   - \"interface\": Adapter ID ('vmnic*', 'vmk*') OR Port Group name.\n   - \"parent\": Clean switch instance name.\n   - \"purpose\": Functional service / Port Group name.\n   - \"uplink_role\": 'Active Uplink' for vmnic; leave empty (\"\") for vmk and Port Groups.\n   - \"speed\": Link speed for vmnic (e.g., '10000', '1000').\n   - \"ip\": Exact IPv4 address for vmk; otherwise empty (\"\").\n   - \"slot\": Hardware PCIe slot identifier when present; otherwise empty (\"\").\n\n7. VALID ENTITY ENFORCEMENT:\n   - Discard any null/empty rows where 'interface' is missing, empty, or 'None'.\n   - Return ONLY a flat JSON array of discrete interface objects.",
      "export_prompt": "You are an expert infrastructure network engineer specializing in VMware ESXi.\nI have attached screenshots of VMware ESXi virtual switch topology and physical network adapter properties.\nPlease analyze the images and extract the network topology into a flat JSON array of objects matching these exact attributes:\n- interface: 'vmnicX' or 'vmkX' (e.g., 'vmnic1', 'vmk0')\n- parent: 'vSwitchX' (e.g., 'vSwitch0'). TOPOLOGY PRIORITY: Every adapter listed in the switch's Physical Adapters column strictly belongs to that switch. NEVER output parent as null or unassigned for grouped/secondary adapters (e.g., vmnic5 under vSwitch0).\n- purpose: Pure service name ('Management Network', 'vMotion', 'iSCSI01') without appending switch names or roles. Secondary adapters inherit the primary management network purpose.\n- uplink_role: 'Active Uplink' by default for all connected vmnic adapters (unless explicitly marked standby in failover settings); leave empty string \"\" for vmk.\n- slot: Hardware PCIe slot (e.g., '0000:5b:00.0')\n- speed: Link speed (e.g., '10 Gbit/s Full', '1 Gbit/s Full')\n- ip: IPv4 address for vmk ports\n\nOutput ONLY a valid JSON array of objects: [ {...}, {...} ]. Do not wrap in markdown fences or include explanatory text.",
      "spatial_anchors_and_redaction": {
        "enabled": true,
        "anchors": [
          {
            "role": "left_boundary",
            "patterns": [
              "Virtual switches",
              "Networking"
            ]
          },
          {
            "role": "container_header",
            "patterns": [
              "Standard Switch:",
              "DVSwitch:",
              "vSphere Distributed Switch:"
            ]
          },
          {
            "role": "adapter_column",
            "patterns": [
              "Physical Adapters",
              "Uplinks"
            ]
          }
        ],
        "redact_ipv4": true,
        "redact_domains": true,
        "domain_patterns": [
          "\\.adds$",
          "\\.local$",
          "\\.internal$",
          "\\.corp$"
        ],
        "redact_mac": true
      }
    },
    "Proxmox VE": {
      "platform": "Proxmox VE",
      "aliases": {
        "parent": [
          "bridge",
          "vmbr"
        ],
        "interface": [
          "bond",
          "eth",
          "eno",
          "ens",
          "vmbr"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "instructions": "[PLATFORM ARCHITECTURE: PROXMOX VE]\n1. HIERARCHY & BRIDGES:\n   - Root bridges: 'vmbr0', 'vmbr1', etc.\n   - Bonds: 'bond0', 'bond1', etc.\n   - Physical slaves: 'eno1', 'ens18', etc.\n2. ATOMIC ATTRIBUTES:\n   - \"interface\": Interface or bridge name.\n   - \"parent\": Connected bridge or bond master.\n   - \"purpose\": Functional service name or VLAN purpose.\n   - \"ip\": CIDR IP address assigned to bridge/interface.\n   - \"speed\": Link speed if visible.",
      "export_prompt": "You are an expert infrastructure network engineer specializing in Proxmox VE.\nI have attached screenshots of Proxmox VE network configuration (/etc/network/interfaces / GUI).\nPlease extract the Linux Bridge (vmbr), Bond, and physical interfaces into the standard atomic JSON format matching these exact attributes:\n- interface: 'vmbrX', 'bondX', or physical NIC ('ensX', 'enoX')\n- parent: Connected bridge or master\n- purpose: Functional description or VLAN profile\n- ip: CIDR IP address if assigned\n\nOutput ONLY a JSON object with key \"interfaces\": array of objects."
    },
    "Microsoft Azure": {
      "platform": "Microsoft Azure",
      "instructions": "1. Acquire a high‑resolution screenshot or PDF of the Azure network topology diagram.\n2. Pre‑process the image: convert to grayscale, apply contrast enhancement, and de‑skew if needed.\n3. Run OCR (e.g., Tesseract) on the entire image to extract all textual elements.\n4. Parse OCR output line‑by‑line, normalising whitespace and removing OCR artefacts (e.g., \"l\" vs \"1\").\n5. Identify graphical primitives using a computer‑vision library (OpenCV):\n   a. Detect rectangles, rounded rectangles, and clouds – typically representing Azure resources (VMs, VNet, Subnet, Load Balancer, etc.).\n   b. Detect arrows/lines – representing connections or traffic flow.\n   c. Detect icons/logos – map known Azure icons (e.g., \"Virtual Machine\", \"SQL Database\", \"Application Gateway\") to resource types.\n6. Correlate OCR‑extracted text with detected shapes by spatial proximity (centroid of text within shape bounds).\n7. Build a structured representation:\n   a. For each resource, capture: name, type (derived from icon or keyword), region, resource group (if present), and any tags.\n   b. For each connection, capture source resource, destination resource, direction (if arrow is unidirectional), and protocol/port annotations (if present).\n8. Resolve hierarchical relationships:\n   a. Group resources under their VNet/Subnet containers based on nesting or explicit labels.\n   b. Associate NICs, Public IPs, and Load Balancers with the VM they belong to.\n9. Validate extracted data against Azure naming conventions and known resource schemas (e.g., VM names must match /^[a-z0-9-]{1,64}$/).\n10. Output the final topology as a JSON object with two top‑level arrays: \"resources\" and \"connections\".\n11. Perform a sanity check: ensure every connection references existing resources and that there are no orphan nodes.\n12. Log any ambiguous or low‑confidence detections for manual review.",
      "export_prompt": "You are an AI assistant tasked with extracting a complete Azure network topology from a screenshot or PDF diagram. The diagram may contain Azure resource icons (VM, VNet, Subnet, Application Gateway, Azure Firewall, Load Balancer, Storage Account, etc.), textual labels, and arrows indicating connections.\n\nYour job is to:\n1. Identify every Azure resource, capturing its exact name as shown, its type (based on icon or label), and any additional attributes such as region, resource group, or tags.\n2. Detect all connections between resources, noting the source, destination, direction (if the arrow is one‑way), and any protocol/port information displayed on the line.\n3. Preserve hierarchical relationships (e.g., VMs inside a Subnet, Subnets inside a VNet).\n4. Return the extracted data in the following JSON structure:\n{\n  \"resources\": [\n    {\n      \"name\": \"<resource_name>\",\n      \"type\": \"<azure_resource_type>\",\n      \"region\": \"<region_if_present>\",\n      \"resource_group\": \"<resource_group_if_present>\",\n      \"tags\": { \"key\": \"value\", ... }\n    }\n    ...\n  ],\n  \"connections\": [\n    {\n      \"source\": \"<source_resource_name>\",\n      \"destination\": \"<dest_resource_name>\",\n      \"direction\": \"unidirectional|bidirectional\",\n      \"protocol\": \"<protocol_if_shown>\",\n      \"port\": \"<port_if_shown>\"\n    }\n    ...\n  ]\n}\n\nIf any element is ambiguous or unreadable, mark its value as null and add a comment field explaining the uncertainty. Do not include any explanatory text outside the JSON. Ensure the JSON is syntactically valid.",
      "aliases": {
        "parent": [
          "vnet",
          "virtual_network"
        ],
        "interface": [
          "eth0",
          "vNIC",
          "nic"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      }
    }
  },
