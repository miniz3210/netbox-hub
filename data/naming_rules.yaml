pattern_variables:
  site:
    label: Site / Branch Name
    placeholder: e.g. Bristol, AGE, NYC
    scope: shared
  site_slug:
    label: Site URL Slug
    placeholder: e.g. bristol, age, nyc
    scope: shared
  country:
    label: Country Code (2-letter)
    placeholder: e.g. US, UK, AU, DE, JP
    scope: shared
  state:
    label: State / Region (Optional)
    placeholder: e.g. NY, CA, TX, NSW
    scope: shared
  domain:
    label: Domain Name (FQDN Suffix)
    placeholder: e.g. corp.example.com, internal.net
    scope: shared
  status:
    label: Object Status
    placeholder: active / planned
    default: active
    scope: shared
  corp_domain_it:
    label: IT / Corporate ESXi Domain
    placeholder: .example.corp
    required: true
    scope: shared
  corp_domain_ot_primary:
    label: OT Primary Cluster Domain
    placeholder: .example.ot
    required: true
    scope: shared
  corp_domain_ot_secondary:
    label: OT Secondary Cluster Domain
    placeholder: .example.ot
    required: true
    scope: shared
  corp_domain_local:
    label: Branch / Local Domain
    placeholder: .corp.local
    required: true
    scope: shared
  vid:
    label: VLAN ID
    placeholder: e.g. 100, 300
    scope: ipam
  vlan_id:
    label: VLAN ID (Alias)
    placeholder: e.g. 100, 300
    scope: ipam
  role:
    label: VLAN / Subnet Role
    placeholder: e.g. Corporate WiFi, Workstations
    scope: ipam
  vlan_name:
    label: NetBox VLAN Name
    placeholder: e.g. Corporate WiFi
    scope: ipam
  vlan_desc:
    label: VLAN Description
    placeholder: e.g. VIN_Corp
    scope: ipam
  subnet:
    label: Subnet (CIDR)
    placeholder: e.g. 10.113.64.0/24
    scope: ipam
  prefix:
    label: Prefix (CIDR)
    placeholder: e.g. 10.113.64.0/24
    scope: ipam
  prefix_desc:
    label: Prefix Description
    placeholder: e.g. Bristol Corporate WiFi -- VLAN 300
    scope: ipam
  scope_id:
    label: NetBox Scope ID (Site ID)
    placeholder: e.g. 30
    scope: ipam
  scope_type:
    label: NetBox Scope Type
    placeholder: dcim.site
    default: dcim.site
    scope: ipam
  site_supernet:
    label: Site Supernet (CIDR)
    placeholder: e.g. 10.113.64.0/21
    scope: ipam
  supernet_desc:
    label: Supernet Description
    placeholder: e.g. Site Subnet - 10.113.64.1 - 10.113.71.254
    scope: ipam
  vlan_group:
    label: VLAN Group Name
    placeholder: e.g. Bristol VLAN Group
    scope: ipam
  vlan_group_slug:
    label: VLAN Group Slug
    placeholder: e.g. bristol-vlan-group
    scope: ipam
  zone:
    label: Zone / Role / Vendor (Optional)
    placeholder: e.g. CORE, DIST, EDGE, PA
    scope: naming
  vendor:
    label: Vendor (Optional)
    placeholder: e.g. PA, CISCO, HUAWEI
    scope: naming
  seq:
    label: Sequence Number
    placeholder: e.g. 01, 02
    scope: naming
  stack_id:
    label: Stack / Member ID (Optional)
    placeholder: e.g. 0, 1
    scope: naming
  local_device:
    label: Local Device Hostname
    placeholder: e.g. SWUSNYC01-0
    scope: naming
  local_port:
    label: Local Port
    placeholder: e.g. Gi1/0/48, Te1/0/1
    scope: naming
  remote_device:
    label: Remote Device Hostname
    placeholder: e.g. SWUSNYC02-0
    scope: naming
  remote_port:
    label: Remote Port
    placeholder: e.g. Gi1/0/48, Te1/0/1
    scope: naming
  local_po_id:
    label: Local Port-Channel ID
    placeholder: LAG1
    scope: naming
  device:
    label: Connected Device
    placeholder: e.g. WAP01
    scope: naming
  port:
    label: Connected Port
    placeholder: e.g. Gi0/1
    scope: naming
  role_zone:
    label: Security Zone / Role
    placeholder: e.g. INSIDE, OUTSIDE
    scope: naming
  role_esx:
    label: Host Role (Optional)
    placeholder: e.g. esx, otinfhost, infhost
    scope: naming
  site_prefix:
    label: Site Prefix (Short Code)
    placeholder: e.g. age, nyc, lon, syd
    scope: naming
  vm_site:
    label: Site Prefix / Country & Site
    placeholder: e.g. age, usnyc, uklon
    scope: naming
  vmnic:
    label: vmnic Name
    placeholder: vmnic
    default: ''
    scope: hypervisor
  v_switch:
    label: vSwitch Name
    placeholder: vSwitch
    default: ''
    scope: hypervisor
  purpose:
    label: Purpose / Service
    placeholder: e.g. Management, vMotion, Storage
    default: ''
    scope: hypervisor
  port_group:
    label: Port Group / vSwitch
    placeholder: e.g. vSwitch0
    default: ''
    scope: hypervisor
  interface:
    label: Interface / Port Group Name
    placeholder: e.g. vmnic0, PG-VMDK
    default: ''
    scope: hypervisor
  slot:
    label: Hardware Slot / Port
    placeholder: e.g. PCIe1/Port1, Card1/Port1
    default: ''
    optional: true
    scope: hypervisor
  active_vmnics:
    label: Active vmnics
    placeholder: e.g. vmnic0, vmnic1
    default: ''
    optional: true
    scope: hypervisor
  standby_vmnics:
    label: Standby vmnics (Optional)
    placeholder: e.g. vmnic2
    default: ''
    optional: true
    scope: hypervisor
  vmk:
    label: vmk Name
    placeholder: vmk
    default: ''
    scope: hypervisor
  switch_zone:
    label: Switch Zone / Network Zone
    placeholder: e.g. DMZ, Production, Management
    default: ''
    scope: hypervisor
  uplink_role:
    label: Uplink Role / Status
    placeholder: Active Uplink / Standby Uplink
    default: ''
    optional: true
    scope: hypervisor
hardware_slot_mappings: {}
csv_schemas:
  import_site:
    headers:
    - name
    - slug
    - status
    row_template:
    - '"<site>"'
    - '"<site_slug>"'
    - active
  import_vlan_group:
    headers:
    - name
    - slug
    - scope_type
    - scope_id
    row_template:
    - '"<vlan_group>"'
    - '"<vlan_group_slug>"'
    - '"<scope_type>"'
    - <scope_id>
  import_vlans:
    headers:
    - vid
    - name
    - status
    - site
    - group
    - description
    - role
    row_template:
    - <vid>
    - '"<vlan_name>"'
    - active
    - '"<site>"'
    - '"<vlan_group>"'
    - '"<vlan_desc>"'
    - '"<role>"'
  import_prefixes:
    headers:
    - prefix
    - status
    - scope_type
    - scope_id
    - vlan_group
    - vlan
    - role
    - description
    row_template:
    - '"<prefix>"'
    - active
    - '"<scope_type>"'
    - <scope_id>
    - '"<vlan_group>"'
    - <vid>
    - '"<role>"'
    - '"<prefix_desc>"'
    supernet_template:
    - '"<site_supernet>"'
    - active
    - '"<scope_type>"'
    - <scope_id>
    - '"<vlan_group>"'
    - ''
    - ''
    - '"<supernet_desc>"'
hardware_baseline_standards:
  server:
    display_name: Server
    console_ports: Serial (de-9)
    module_bays: PSU1, PSU2, OCP3, PCIe1, PCIe2, PCIe3
    interfaces: 'OOB Management ONLY (1000base-t, mgmt_only: true)'
  module_nic:
    display_name: Module / NIC
    interface_pattern: '{module}/Port{index}'
    default_port_count: 2
    port_start_index: 1
  storage_san:
    display_name: Storage / SAN
    interface_pattern: '{module}/Port{index}'
    default_port_count: 4
    port_start_index: 1
topology_parsing_presets:
  VMware ESXi:
    platform: VMware ESXi
    aliases:
      parent:
      - v_switch
      - vswitch
      - dvswitch
      interface:
      - vmnic
      - vmk
      - port_group
      speed:
      - speed
      - link_speed
    export_prompt: ""
    spatial_anchors_and_redaction:
      anchors:
      - role: left_boundary
        patterns:
        - Virtual switches
      - role: container_header
        patterns:
        - 'Standard Switch:'
      - role: adapter_column
        patterns:
        - Physical Adapters
      enabled: false
    layout_geometry:
      sidebar_x_cutoff: 280.0
      midline_ratio: 0.48
      header_proximity_threshold: 85.0
      nic_speed_y_proximity: 18.0
    noise_filters:
    - Storage Adapters
    - Storage Devices
    - Host Cache Configuration
    - Protocol Endpoints
    - I/O Filters
    - Storage Providers
    - VMkernel adapters
    - Physical adapters
    - TCP/IP configuration
    - Virtual switches
    - Virtual Machines
    - VM Startup/Shutdown
    - Agent VM Settings
    - Default VM Compatibility
    - Swap File Location
    - SwapFile Location
    - Licensing
    - Host Profile
    - Time Configuration
    - Authentication Services
    - Power Management
    - Security Profile
    - System Swap
    - Certificate
    - Advanced System
    - System Resource
    - Firewall
    - Services
    - Summary
    - Monitor
    - Configure
    - Permissions
    - VMs
    - Datastores
    - Updates
    - Actions
    - Networking
    - System
    - Hardware
    token_normalizations:
    - pattern: vSwitch[oO](\d*)
      replace: vSwitch0\1
    - pattern: \bvm[nN][kKlL1]c(\d+)\b
      replace: vmnic\1
    - pattern: \bvmk[oO0](\d*)\b
      replace: vmk0\1
    - pattern: \s+
      replace: ' '
    - pattern: (?i)PR\s*Spain\s*Fuenmayor
      replace: PR Spain Fuenmayor
    - pattern: (?i)PR\s*SpainFuenmayor
      replace: PR Spain Fuenmayor
    - pattern: (?i)FuenmayorAge
      replace: Fuenmayor Age
    - pattern: (?i)Age\s*VLab
      replace: Age VLab
    - pattern: (?i)AgeVLab
      replace: Age VLab
    - pattern: (?i)PR\s*Spain\s*Fuenmayor\s*VLab\s*VM.*
      replace: 'PR Spain Fuenmayor VLab VM ...'
    - pattern: \bvmk[oO]\b
      replace: vmk0
    - pattern: (?i)Netwrork
      replace: Network
    - pattern: \bDistibut(ed)?\b
      replace: Distributed
    - pattern: \bPHYSKCAL\b
      replace: PHYSICAL
    ocr_llm_prompt: ""
  Proxmox VE:
    platform: Proxmox VE
    aliases:
      parent:
      - bridge
      - vmbr
      interface:
      - bond
      - eth
      - eno
      - ens
      - vmbr
      speed:
      - speed
      - link_speed
    instructions: ""
    export_prompt: ""
  Microsoft Azure:
    platform: Microsoft Azure
    aliases:
      parent:
      - vnet
      - virtual_network
      interface:
      - eth0
      - vNIC
      - nic
      speed:
      - speed
      - link_speed
    instructions: ""
    export_prompt: ""
hypervisor_presets:
  VMware ESXi:
  - code: Switch_Teaming
    label: Switch Teaming Header
    pattern: <v_switch> (<teaming>)
  - code: Uplink
    label: Physical Uplink
    pattern: <vmnic> - <v_switch> <purpose> <uplink_role>
  - code: PortGroup
    label: Port Group
    pattern: <purpose> (<v_switch>)
  - code: VMkernel
    label: VMkernel
    pattern: <purpose> (<v_switch>)
  Proxmox VE:
  - code: Bond
    label: Linux Bond
    pattern: <bond> (<slaves> Active)
  - code: Bridge
    label: Linux Bridge
    pattern: <bridge> - <purpose>
platform_tokens: {}
