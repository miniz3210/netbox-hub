      "default_disconnected_role": "None",
      "sentinel_no_adapter": "No Uplink Interface",
      "instructions": "Parse OpenShift network attachments and interfaces into standard JSON entities.\n\nExtract ALL observed network entities into a flat JSON array of objects. Every record MUST strictly contain these lowercase keys:\n[\n  {\n    \"switch\": \"<Node or Cluster name>\",\n    \"interface\": \"<Interface name: physical (e.g. eth0), bond (e.g. bond0), or empty for OVS bridges>\",\n    \"type\": \"<MANDATORY: Strictly one of 'Physical Interface', 'Bond CNI', 'NAD', 'OVS Bridge'>\",\n    \"ip\": \"<IP address if assigned, otherwise empty string>\",\n    \"purpose\": \"<Functional description>\",\n    \"role\": \"<For Bonds: 'Primary' (default for primary member), 'Secondary', or 'None' (only for No Uplink Interface). For OVS: 'None'. For NAD: 'None'>\",\n    \"speed\": \"<Link speed if visible, otherwise empty string>\"\n  }\n]\n\nCRITICAL RULES:\n1. OVS Bridges get type: 'OVS Bridge' with empty interface.\n2. Bonds get type: 'Bond CNI' with member interfaces.\n3. Physical NICs get type: 'Physical Interface' as members of bonds or standalone.\n4. NetworkAttachmentDefinitions get type: 'NAD'.\n5. If a bond has no uplink interfaces, emit: interface: 'No Uplink Interface', type: 'Bond CNI', role: 'None'.\n6. Return ONLY a valid JSON array of objects.",
      "export_prompt": "Parse OpenShift network attachments and interfaces into standard JSON entities.\n\nExtract ALL observed network entities into a flat JSON array of objects. Every record MUST strictly contain these lowercase keys:\n[\n  {\n    \"switch\": \"<Node or Cluster name>\",\n    \"interface\": \"<Interface name: physical (e.g. eth0), bond (e.g. bond0), or empty for OVS bridges>\",\n    \"type\": \"<MANDATORY: Strictly one of 'Physical Interface', 'Bond CNI', 'NAD', 'OVS Bridge'>\",\n    \"ip\": \"<IP address if assigned, otherwise empty string>\",\n    \"purpose\": \"<Functional description>\",\n    \"role\": \"<For Bonds: 'Primary' (default for primary member), 'Secondary', or 'None' (only for No Uplink Interface). For OVS: 'None'. For NAD: 'None'>\",\n    \"speed\": \"<Link speed if visible, otherwise empty string>\"\n  }\n]\n\nReturn ONLY a valid JSON array of objects."
    },
    "Microsoft Azure": {
      "platform": "Microsoft Azure",
      "aliases": {
        "parent": [
          "vnet",
          "virtual_network"
        ],
        "interface": [
          "eth0",
          "vNIC",
          "nic"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "instructions": "[PLATFORM ARCHITECTURE: MICROSOFT AZURE]\n1. HIERARCHY:\n   - Virtual Networks (vnet) contain subnets.\n   - Network Interfaces (NIC/vNIC) belong to a subnet within a vnet.\n2. ATOMIC ATTRIBUTES:\n   - \"interface\": NIC or vNIC name.\n   - \"parent\": The virtual network (vnet) or subnet name.\n   - \"purpose\": Functional role (e.g. Management, Production, Database).\n   - \"ip\": Private IP address assigned to the NIC.",
      "export_prompt": "You are an expert infrastructure network engineer specializing in Microsoft Azure.\nI have attached screenshots of Azure Virtual Network and Network Interface configurations.\nPlease extract the network topology into the standard atomic JSON format matching these exact attributes:\n- interface: NIC or vNIC name\n- parent: Virtual network (vnet) or subnet name\n- purpose: Functional role or service designation\n- ip: Private IP address\n\nOutput ONLY a JSON object with key \"interfaces\": array of objects."
    }
  },
