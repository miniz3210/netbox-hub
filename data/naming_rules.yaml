  "topology_parsing_presets": {
    "VMware ESXi": {
      "platform": "VMware ESXi",
      "aliases": {
        "parent": [
          "v_switch",
          "vswitch",
          "dvswitch"
        ],
        "interface": [
          "vmnic",
          "vmk",
          "port_group"
        ],
        "speed": [
          "speed",
          "link_speed"
        ]
      },
      "instructions": "[PLATFORM ARCHITECTURE: VMWARE ESXI & VCENTER TOPOLOGY RECONCILIATION]\n\nOBJECTIVE:\nYou are an expert datacenter network engineer. Your task is to parse spatially ordered OCR text extracted from VMware ESXi and vCenter network configuration screens (supporting Standard Switches and Distributed Switches / vDS across all vSphere versions) into an exact, deduplicated JSON array representing the complete virtual networking topology.\n\n================================================================================\n1. SWITCH HEADER FUZZY RECOGNITION & SCOPING (ZERO-BLEED POLICY)\n================================================================================\n- SWITCH BOUNDARY DEFINITIONS:\n  * A switch container strictly begins whenever text matching:\n    .*(Standard|Distribut|Distibut|dvSwitch|vSwitch).*Switch:?\\s*(?P<switch_name>[^\\n|]+)\n    appears ANYWHERE on a line (even if preceded by UI navigation tokens like 'Agent VM Settings', 'Storage', or '>').\n  * Whenever a switch header appears, it IMMEDIATELY terminates the previous switch and starts a brand-new switch scope.\n  * Strip generic prefixes to isolate the pure switch identifier (e.g., 'vSwitch0', 'vSwitch01', 'dvSwitch0', 'iDMZ-vdSwitch02', 'PR Spain Fuenmayor VLab').\n  * Normalize OCR letter/digit typos in switch names: strictly convert 'vSwitcho' or 'vSwitchO' to 'vSwitch0', and 'vSwitcho1' to 'vSwitch01'.\n\n- IGNORE LEFT NAVIGATION TREE:\n  * Ignore UI menu items from ESXi sidebar trees (e.g., 'Storage Adapters', 'Host Cache', 'Virtual switches', 'Agent VM Settings', 'System', 'Licensing', 'Host Profile', 'Firewall', 'Hardware'). These are navigation categories, NOT switch components.\n\n- MULTI-SCREENSHOT STATE RESOLUTION:\n  * If a switch appears collapsed (prefixed with '>') in an earlier screenshot but expanded (prefixed with 'v') with active interfaces in another, the EXPANDED state always takes absolute precedence.\n\n================================================================================\n2. MULTI-ADAPTER UPLINK TEAMING (ZERO ADAPTER OMISSION)\n================================================================================\n- MANDATORY MULTI-NIC EXTRACTION:\n  * Virtual switches frequently group MULTIPLE physical adapters in an active/standby bond or NIC team (e.g., vmnic4 AND vmnic5, vmnic2 AND vmnic6, vmnic0 AND vmnic1).\n  * YOU MUST EXTRACT EVERY SINGLE 'vmnic<N>' listed under the Physical Adapters column or Uplink panel.\n  * NEVER stop after extracting the first adapter. If two or more physical NICs appear under the switch, generate a separate record for EACH physical adapter with type: \"Uplink\".\n\n================================================================================\n3. DETERMINISTIC CONTEXTUAL OCR RECOVERY & TWO-COLUMN DISCIPLINE\n================================================================================\nVMware network screens are bifurcated into two visual columns:\n\n- RIGHT PANEL = PHYSICAL INFRASTRUCTURE:\n  * Invariant: VMkernel adapters ('vmk*') NEVER exist in the physical uplink panel.\n  * RECOVERY RULE: If an interface token in the right panel (under 'Physical Adapters', 'Uplink [0-9]+', or adjacent to link speeds/FQDN) is corrupted (e.g., 'vmnkc3', 'vmn1c3', 'vmnlc3', 'vmnc3', or misread as 'vmk3'), extract the trailing integer <N> and strictly normalize to 'vmnic<N>' with type: 'Uplink' and role: 'Active Uplink'.\n  * Uplink Container Exclusion: Right-panel wrappers (e.g., 'Physical Adapters', 'Uplink 1', 'Uplink 2', or vDS system containers matching '*-DVUplinks-[0-9]+') are physical framing wrappers. NEVER extract them as Port Groups or Services.\n\n- LEFT PANEL = LOGICAL NETWORK SERVICES:\n  * VMkernel Interfaces: Identified by 'vmk[0-9]+' (or 'vmko' -> 'vmk0') paired with an IPv4 address.\n  * Virtual Machine Port Groups: Identified by network labels accompanied by 'VLAN ID: ...' and 'Virtual Machines (N)'. Extract them even if 'Virtual Machines (0)' is displayed.\n\n================================================================================\n4. ISOLATED & NO-UPLINK SWITCHES\n================================================================================\n- If a switch explicitly displays 'No physical network adapters' or lacks physical adapters across all screenshots, output a placeholder uplink record:\n  interface: \"No Uplink\", type: \"Uplink\", role: \"None\", purpose: \"Internal Only\", ip: \"\", speed: \"\".\n\n================================================================================\n5. ATOMIC RECORD SCHEMA & VALUE CONSTRAINTS\n================================================================================\nEvery record in the output JSON array must strictly contain these 7 keys:\n1. \"switch\": Clean virtual switch identifier.\n2. \"interface\": 'vmnic<N>', 'vmk<N>', 'No Uplink', or \"\" for pure Port Groups.\n3. \"type\": \"Uplink\", \"VMkernel\", or \"Port Group\".\n4. \"ip\": Valid IPv4 address for VMkernel ports; empty string \"\" for all others.\n5. \"purpose\": \n   - For VMkernel ports: specific service name (e.g., 'Management Network', 'vMotion Network', 'vSAN Network', 'iSCSI01').\n   - For physical adapters: inherit switch primary service or 'Uplink'.\n   - For pure Port Groups: the exact port group label (e.g., 'PR Spain Fuenmayor VLab VM', 'VM Network', 'iDMZ Servers').\n   - STRICT PROHIBITION: Do NOT append '(vSwitchX)', 'Active Uplink', or role strings into 'purpose'.\n6. \"role\": \"Active Uplink\" (default for connected vmnic), \"Standby Uplink\", or \"None\".\n7. \"speed\": Normalized speed string (e.g., '10 Gbit/s Full', '1 Gbit/s Full') if visible; otherwise \"\".\n\n================================================================================\nOUTPUT FORMAT:\nReturn ONLY a valid, raw JSON array of objects.\nDo not wrap in markdown code blocks.\nDo not include introductory or explanatory text.",
      "export_prompt": "You are an expert infrastructure network engineer specializing in VMware ESXi.\nI have attached screenshots of VMware ESXi virtual switch topology and physical network adapter properties.\nPlease analyze the images and extract the network topology into the standard atomic JSON format matching these exact attributes:\n- interface: 'vmnicX' or 'vmkX'\n- parent: 'vSwitchX' (or null if unassigned)\n- purpose: Pure service name ('Management Network', 'vMotion', 'iSCSI01') without appending switch names or roles\n- uplink_role: 'Active Uplink' or 'Standby Uplink' for vmnics connected to a switch; null if unassigned or vmk\n- slot: Hardware PCIe slot (e.g. '0000:5b:00.0')\n- speed: Link speed (e.g. '10 Gbit/s Full')\n- ip: IP address for vmk ports\n\nOutput ONLY a JSON object with key \"interfaces\": array of objects.",
