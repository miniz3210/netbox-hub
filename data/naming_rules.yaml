  "pattern_variables": {
    "country": {
      "label": "Country Code (2-letter)",
      "placeholder": "e.g. US, UK, AU, DE, JP",
      "optional": false
    },
    "state": {
      "label": "State / Region (Optional)",
      "placeholder": "e.g. NY, CA, TX, NSW",
      "optional": true
    },
    "site": {
      "label": "Site Code",
      "placeholder": "e.g. NYC, LON, SYD, AGE",
      "optional": false
    },
    "zone": {
      "label": "Zone / Role / Vendor (Optional)",
      "placeholder": "e.g. CORE, DIST, EDGE, PA",
      "optional": true
    },
    "vendor": {
      "label": "Vendor (Optional)",
      "placeholder": "e.g. PA, CISCO, HUAWEI",
      "optional": true
    },
    "seq": {
      "label": "Sequence Number",
      "placeholder": "e.g. 01, 02",
      "optional": false
    },
    "stack_id": {
      "label": "Stack / Member ID (Optional)",
      "placeholder": "e.g. 0, 1",
      "optional": true
    },
    "local_device": {
      "label": "Local Device Hostname",
      "placeholder": "e.g. SWUSNYC01-0",
      "optional": false
    },
    "local_port": {
      "label": "Local Port",
      "placeholder": "e.g. Gi1/0/48, Te1/0/1",
      "optional": false
    },
    "remote_device": {
      "label": "Remote Device Hostname",
      "placeholder": "e.g. SWUSNYC02-0",
      "optional": false
    },
    "remote_port": {
      "label": "Remote Port",
      "placeholder": "e.g. Gi1/0/48, Te1/0/1",
      "optional": false
    },
    "local_po_id": {
      "label": "Local Port-Channel ID",
      "placeholder": "LAG1",
      "default": "LAG",
      "optional": false
    },
    "vlan_name": {
      "label": "VLAN Name",
      "placeholder": "e.g. DATA, VOIP",
      "optional": false
    },
    "vlan_id": {
      "label": "VLAN ID",
      "placeholder": "e.g. 10, 20",
      "optional": false
    },
    "device": {
      "label": "Connected Device",
      "placeholder": "e.g. WAP01",
      "optional": false
    },
    "port": {
      "label": "Connected Port",
      "placeholder": "e.g. Gi0/1",
      "optional": false
    },
    "role_zone": {
      "label": "Security Zone / Role",
      "placeholder": "e.g. INSIDE, OUTSIDE",
      "optional": false
    },
    "domain": {
      "label": "Domain Name (FQDN Suffix)",
      "placeholder": "e.g. corp.example.com, internal.net",
      "optional": false
    },
    "role": {
      "label": "Role Code / Workload",
      "placeholder": "e.g. app, web, db, fs, dc",
      "optional": true
    },
    "role_esx": {
      "label": "Host Role (Optional)",
      "placeholder": "e.g. esx, otinfhost, infhost",
      "optional": true
    },
    "site_prefix": {
      "label": "Site Prefix",
      "placeholder": "e.g. age, nyc, lon, syd",
      "optional": false
    },
    "vm_site": {
      "label": "Site Prefix / Country & Site",
      "placeholder": "e.g. age, usnyc, uklon",
      "optional": false
    },
    "vmnic": {
      "label": "vmnic Name",
      "placeholder": "vmnic",
      "default": "vmnic0",
      "optional": false
    },
    "v_switch": {
      "label": "vSwitch Name",
      "placeholder": "vSwitch",
      "default": "vSwitch",
      "optional": false
    },
    "purpose": {
      "label": "Purpose / Service",
      "placeholder": "e.g. Management, vMotion, Storage",
      "optional": false
    },
    "status": {
      "label": "Status",
      "placeholder": "Active Uplink / Standby Uplink",
      "optional": false
    },
    "pg_network": {
      "label": "Network",
      "placeholder": "e.g. VM Network",
      "optional": false
    },
    "port_group": {
      "label": "Port Group / vSwitch",
      "placeholder": "e.g. vSwitch0",
      "default": "vSwitch",
      "optional": false
    },
    "active_vmnics": {
      "label": "Active vmnics",
      "placeholder": "e.g. vmnic0, vmnic1",
      "default": "vmnic",
      "optional": false
    },
    "standby_vmnics": {
      "label": "Standby vmnics (Optional)",
      "placeholder": "e.g. vmnic2",
      "optional": false
    },
    "vmk": {
      "label": "vmk Name",
      "placeholder": "vmk",
      "default": "vmk",
      "optional": false
    }
  },
  "site_code_rules": {
    "separators": [
      " ",
      "-",
      "_"
    ],
    "multi_word_chars_per_word": [
      2,
      2
    ],
    "single_word_max_chars": 4,
    "fallback": "SITE",
    "exact_mappings": {
      "new york": "NYC",
      "london": "LON",
      "sydney": "SYD",
      "singapore": "SIN",
      "tokyo": "TYO",
      "hong kong": "HKG",
      "amsterdam": "AMS",
      "frankfurt": "FRA",
      "paris": "PAR",
      "chicago": "CHI",
      "los angeles": "LAX",
      "san francisco": "SFO",
      "dallas": "DAL",
      "seattle": "SEA",
      "boston": "BOS",
      "toronto": "TOR",
      "bristol": "BRI",
      "age": "AGE"
    }
  },
  "token_order": {
    "esxi_vmkernel_name": [
      "vmk",
      "purpose",
      "v_switch",
      "active_vmnics",
      "standby_vmnics"
