services:
  netbox-hub:
    image: ghcr.io/miniz3210/netbox-hub:latest
    build: .
    container_name: netbox-hub
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLE_REST_API=1
      - HUB_SYNC_KEY=netbox-hub-secret-sync-key
    env_file:
      - ./netbox-hub/.env
